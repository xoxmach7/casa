name: Deploy to production (VPS)

# Вторая половина пайплайна. Запускается ТОЛЬКО после зелёного CI (или вручную).
# Тяжёлую сборку 3 образов делаем на раннерах GitHub и публикуем в GHCR, затем
# VPS просто ТЯНЕТ образы и перезапускает контейнеры — сам он больше не собирает
# (на Basic-2 сборка фронта занимала ~20 мин). См. docs/CI-CD.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images (GHCR)
    # Деплоим только по зелёному CI; ручной запуск (workflow_dispatch) разрешён.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: delivery/backend
            build_args: ""
          - name: frontend
            context: delivery/frontend
            build_args: |
              NEXT_PUBLIC_API_URL=https://pro.casa.kz/api
          - name: casa40
            context: casa40-main
            build_args: |
              VITE_API_URL=
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/casa-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/casa-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check deploy secrets
        id: cfg
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS secrets (VPS_HOST / VPS_USER / VPS_SSH_KEY) не заданы — деплой пропущен. Разовая настройка в docs/CI-CD.md. Образы в GHCR уже собраны."
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - name: Set up SSH
        if: steps.cfg.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose file to server
        if: steps.cfg.outputs.ok == 'true'
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            delivery/deployment/docker-compose.vps.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/casa/delivery/deployment/docker-compose.vps.yml"

      - name: Pull images and restart on server
        if: steps.cfg.outputs.ok == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -e; \
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin; \
             cd ~/casa/delivery/deployment; \
             export IMAGE_TAG='${IMAGE_TAG}'; \
             docker compose -f docker-compose.vps.yml pull backend frontend casa40; \
             docker compose -f docker-compose.vps.yml up -d backend frontend casa40 nginx; \
             docker image prune -f; \
             docker logout ghcr.io"

      - name: Smoke-test production
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -e
          echo '→ CRM /login (expect 200)';   c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://pro.casa.kz/login);      [ "$c" = 200 ] || { echo "CRM login: $c"; exit 1; }
          echo '→ casa40 / (expect 200)';      c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://casa.kz/);              [ "$c" = 200 ] || { echo "casa40: $c"; exit 1; }
          echo '→ backend /api/clients (expect 401)'; c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://pro.casa.kz/api/clients); [ "$c" = 401 ] || { echo "backend: $c"; exit 1; }
          echo 'Smoke tests passed ✓'
