user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Загрузка фото/документов объектов.
    client_max_body_size 50m;

    # Сжатие (Cloudflare добавит Brotli сверху; это фолбэк для прямого доступа).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream crm     { server frontend:3000; }
    upstream backend { server backend:3001; }
    upstream casa40  { server casa40:8080; }

    # Общие proxy-заголовки.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ── pro.casa.kz — CRM (Next.js) + API ──────────────────────────────
    server {
        listen 80;
        server_name pro.casa.kz www.pro.casa.kz;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location /api/     { proxy_pass http://backend; }
        location /uploads/ { proxy_pass http://backend; }
        location /         { proxy_pass http://crm; }
    }

    # ── casa.kz — публичный сайт casa40 (SPA) + API ────────────────────
    # default_server: доступ по голому IP до настройки DNS ведёт сюда.
    server {
        listen 80 default_server;
        server_name casa.kz www.casa.kz _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location /api/     { proxy_pass http://backend; }
        location /uploads/ { proxy_pass http://backend; }
        location /         { proxy_pass http://casa40; }
    }
}
