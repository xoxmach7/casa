<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Шрифт грузим параллельно с CSS (не render-blocking @import). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!-- Primary SEO -->
    <title>Квартиры в Казахстане — купить, продать, новостройки | CASA</title>
    <meta
      name="description"
      content="CASA — сервис недвижимости по Казахстану: квартиры в Астане, Алматы, Шымкенте и других городах. Вторичка и новостройки от застройщиков, запись на просмотр без лишних звонков."
    />
    <meta
      name="keywords"
      content="недвижимость Казахстан, купить квартиру, продать квартиру, новостройки, квартиры Астана, квартиры Алматы, квартиры Шымкент, ЖК Казахстан, вторичка"
    />
    <meta name="author" content="CASA" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://casa.kz/" />
    <meta name="theme-color" content="#0F275D" />

    <!-- Гео-таргетинг: обслуживаем весь Казахстан -->
    <meta name="geo.region" content="KZ" />
    <meta name="geo.placename" content="Казахстан" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CASA" />
    <meta property="og:locale" content="ru_KZ" />
    <meta property="og:url" content="https://casa.kz/" />
    <meta property="og:title" content="Квартиры в Казахстане — купить, продать, новостройки | CASA" />
    <meta
      property="og:description"
      content="Недвижимость по всему Казахстану: Астана, Алматы, Шымкент. Вторичка и новостройки, запись на просмотр без лишних звонков."
    />
    <meta property="og:image" content="https://casa.kz/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Квартиры в Казахстане — купить, продать, новостройки | CASA" />
    <meta
      name="twitter:description"
      content="Недвижимость по всему Казахстану: Астана, Алматы, Шымкент. Вторичка и новостройки, запись на просмотр без лишних звонков."
    />
    <meta name="twitter:image" content="https://casa.kz/og-image.jpg" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: попадает в HTML сразу, до рендера JS (важно для SPA) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "RealEstateAgent",
          "@id": "https://casa.kz/#organization",
          "name": "CASA",
          "url": "https://casa.kz/",
          "logo": "https://casa.kz/og-image.jpg",
          "image": "https://casa.kz/og-image.jpg",
          "telephone": "+77075037160",
          "priceRange": "₸₸",
          "areaServed": [
            { "@type": "Country", "name": "Казахстан" },
            { "@type": "City", "name": "Астана" },
            { "@type": "City", "name": "Алматы" },
            { "@type": "City", "name": "Шымкент" },
            { "@type": "City", "name": "Караганда" },
            { "@type": "City", "name": "Актобе" }
          ],
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "KZ",
            "addressLocality": "Астана"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://casa.kz/#website",
          "url": "https://casa.kz/",
          "name": "CASA",
          "inLanguage": "ru-KZ",
          "publisher": { "@id": "https://casa.kz/#organization" }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
