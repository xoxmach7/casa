user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security-заголовки для всех ответов (наследуются в server/location, т.к.
    # там нет своих add_header). HSTS браузер учитывает только по HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    upstream crm     { server frontend:3000; }
    upstream backend { server backend:3001; }
    upstream casa40  { server casa40:8080; }

    # Общие proxy-заголовки. X-Forwarded-Proto = $scheme (https на :443) —
    # нужно backend'у для secure-cookie и построения URL.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Современный набор шифров (Mozilla intermediate). TLS1.3 шифры фиксированы.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling — быстрее и приватнее проверка отзыва сертификата.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Не раскрываем, что за фреймворк под nginx (Next.js ставит этот заголовок).
    proxy_hide_header X-Powered-By;

    # ── :80 — ACME-челлендж + редирект всего остального на HTTPS ────────
    server {
        listen 80 default_server;
        server_name casa.kz www.casa.kz pro.casa.kz _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── https://pro.casa.kz — CRM (Next.js) + API ──────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name pro.casa.kz;

        # Отдельный сертификат (только pro.casa.kz) — чтобы браузер не мог
        # коалесить HTTP/2-соединение с casa.kz и показывать чужой контент.
        ssl_certificate     /etc/letsencrypt/live/pro.casa.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pro.casa.kz/privkey.pem;

        location /api/     { proxy_pass http://backend; }
        location /uploads/ { proxy_pass http://backend; }
        location /         { proxy_pass http://crm; }
    }

    # ── https://casa.kz — публичный сайт casa40 (SPA) + API ────────────
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name casa.kz www.casa.kz _;

        ssl_certificate     /etc/letsencrypt/live/casa.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/casa.kz/privkey.pem;

        location /api/     { proxy_pass http://backend; }
        location /uploads/ { proxy_pass http://backend; }
        location /         { proxy_pass http://casa40; }
    }
}
