name: CI

# Quality gate for every push and PR. Production deploys wait on this workflow
# (see deploy.yml) — nothing reaches Railway without a green run here.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration + security)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
          POSTGRES_DB: casa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://casa:casa@localhost:5432/casa_test?schema=public
      # Throwaway CI value. Production secrets live in Railway, never here.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      NODE_ENV: test
      PORT: 3002
      CORS_ORIGIN: http://localhost:3000

    defaults:
      run:
        working-directory: delivery/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: delivery/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx tsx src/prisma/seed.ts

      - name: Start API server
        run: |
          nohup node dist/index.js > /tmp/api-server.log 2>&1 &
          echo $! > /tmp/api-server.pid
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/health" > /dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy in 30s"
          cat /tmp/api-server.log
          exit 1

      - name: Integration + security tests
        run: npm run test:integration

      - name: API server log
        if: always()
        run: cat /tmp/api-server.log || true

  frontend:
    name: Frontend (typecheck + unit + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: delivery/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: delivery/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  casa40:
    name: casa40 public site (unit + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: casa40-main

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: casa40-main/package-lock.json

      # lovable-tagger pins vite <8 while @vitejs/plugin-react@6 wants vite 8.
      # The app builds fine on the resolved tree; strict peer resolution is the
      # only thing that objects.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
